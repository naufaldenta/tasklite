<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TaskLite, pengelola tugas sederhana berbasis multi-container.">
    <title>{% block title %}TaskLite{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('tasks.index') }}" aria-label="TaskLite beranda">
        <span class="brand-mark">TL</span>
        <span>
          <strong>TaskLite</strong>
          <small>Kerjaan rapi, kepala santai.</small>
        </span>
      </a>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Flask · PostgreSQL · Docker Compose</p>
    </footer>
  </body>
</html>
