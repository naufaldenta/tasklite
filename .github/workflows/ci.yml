name: CI TaskLite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test dan Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependency
        run: pip install -r requirements-dev.txt

      - name: Jalankan automated test
        run: pytest -q

      - name: Siapkan environment CI
        run: cp .env.example .env

      - name: Validasi Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build --tag tasklite-app:local .

      - name: Jalankan multi-container
        run: docker compose up -d --no-build

      - name: Smoke test aplikasi
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "TaskLite sehat pada percobaan ke-${attempt}."
              exit 0
            fi
            sleep 5
          done

          docker compose ps
          exit 1

      - name: Tampilkan log saat gagal
        if: failure()
        run: docker compose logs --no-color

      - name: Bersihkan container CI
        if: always()
        run: docker compose down -v
